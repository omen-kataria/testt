<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blackline Student Directory — Browse, search, and filter students by semester, skill, and certification."
    />
    <title>Blackline — Student Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="page page-students" data-page="students">
    <div class="page-noise" aria-hidden="true"></div>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="transition-shield" aria-hidden="true"></div>

    <!-- NAV BAR -->
    <header class="glass-panel home-nav" id="home-nav">
      <a class="home-logo" href="index.html">Blackline</a>
      <nav class="home-nav-links">
        <a href="index.html">Home</a>
        <a href="students.html" class="is-current">Students</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <label class="theme-switch" aria-label="Toggle dark mode">
        <input type="checkbox" data-theme-toggle id="theme-toggle-students" />
        <span class="theme-switch-track"
          ><span class="theme-switch-icon sun-icon">☀️</span
          ><span class="theme-switch-thumb"></span
          ><span class="theme-switch-icon moon-icon">🌙</span></span
        >
      </label>
      <a class="primary-button home-profile-btn" href="login.html">
        <span class="btn-text">My Profile</span>
      </a>
    </header>

    <main class="app-shell directory-shell">
      <!-- DIRECTORY HEADER -->
      <section class="glass-panel directory-hero">
        <div class="directory-hero-top">
          <div>
            <p class="eyebrow">Student Directory</p>
            <h1>Find the right talent</h1>
            <p class="lead">
              Browse <strong id="dir-total-count">--</strong> students across
              all semesters. Filter by semester, skill, or search by name.
            </p>
          </div>
        </div>
        <!-- Search bar -->
        <div class="search-panel directory-search-panel">
          <div class="search-input-wrap">
            <div class="search-icon-wrap">
              <svg
                class="search-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                id="dir-search"
                type="search"
                placeholder="Search by name, UID, or skill..."
                autocomplete="off"
              />
            </div>
          </div>
        </div>
      </section>

      <!-- FILTER TABS -->
      <section class="glass-panel directory-filters">
        <div class="dir-filter-tabs" id="dir-filter-tabs">
          <button class="filter-tab is-active" data-filter="all">All Students</button>
          <button class="filter-tab" data-filter="semester">By Semester</button>
          <button class="filter-tab" data-filter="skill">By Skill</button>
          <button class="filter-tab" data-filter="cert">Certifications</button>
        </div>
        <!-- Sub-filters (dynamic) -->
        <div class="dir-sub-filters" id="dir-sub-filters"></div>
      </section>

      <!-- RESULTS SUMMARY -->
      <div class="dir-results-summary" id="dir-results-summary">
        <span id="dir-results-count">-- students</span>
        <span class="dir-active-filter" id="dir-active-filter"></span>
      </div>

      <!-- STUDENT CARDS GRID -->
      <div class="dir-card-grid" id="dir-card-grid"></div>

      <!-- LOAD MORE / PAGINATION -->
      <div class="dir-load-more" id="dir-load-more">
        <button class="secondary-button" id="dir-load-more-btn" type="button">Load More</button>
      </div>

      <!-- FOOTER -->
      <footer class="glass-panel home-footer" style="margin-top: 1rem">
        <p class="subtle-text">
          &copy; 2025 Blackline Student Dashboard. Built with vanilla HTML, CSS & JS.
        </p>
      </footer>
    </main>
    <script defer src="js/app.js"></script>
    <script defer src="js/pages/directory.js"></script>
  </body>
</html>
